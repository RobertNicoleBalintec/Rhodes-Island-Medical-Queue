{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto ak-panel p-8">
    <h2 class="text-2xl font-bold mb-4 text-center">Leave Feedback</h2>
    <p class="text-gray-400 text-center mb-6 text-sm">Enter your queue number to rate your experience</p>
    
    <form method="GET" action="{% url 'feedback_lookup' %}" class="space-y-4">
        <input type="text" name="queue_number" 
               placeholder="e.g. R-001" 
               class="ak-input w-full p-3 text-center text-xl"
               required>
        <button type="submit" class="ak-btn ak-clip w-full py-3 text-lg">
            FIND MY TICKET
        </button>
    </form>
    
    {% if messages %}
        <div class="mt-4 space-y-2">
            {% for message in messages %}
                <div class="p-3 text-center text-sm {% if message.tags == 'error' %}text-red-400{% else %}text-yellow-400{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endblock %}
